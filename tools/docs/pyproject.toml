[project]
name = "femforge-docs"
version = "0.1.0"
description = "Pygments filter and Markdown extension for the femforge docs build."
requires-python = ">=3.12"
dependencies = ["markdown>=3.6", "pygments>=2.12"]
classifiers = ["Private :: Do Not Upload"]

[project.entry-points."pygments.filters"]
femforge = "femforge_docs.highlight:SemanticNames"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
