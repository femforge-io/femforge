[project]
name = "femforge"
version = "0.1.0"
description = "Finite-element analysis as a typed Python API: one config takes a tagged CAD model through meshing and solving to results that carry their units."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Nathan W." }]
keywords = ["fea", "finite-element", "elmer", "gmsh", "electromagnetics", "thermal", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "anytree>=2.13",
    "build123d>=0.13,<0.14",
    "gmsh>=4.13",
    "lazy-loader>=0.4",
    "loguru>=0.7.3",
    "numpy>=2.5",
    "pandas>=3.0",
    "pint>=0.26.1",
    "polars>=2.0,<3",
    "psutil>=7.2.2",
    "pydantic>=2.12",
    "pyyaml>=6.0.3",
    "rich>=15.0",
]

[project.optional-dependencies]
viz = [
    "magpylib>=5.2",
    "matplotlib>=3.11",
    "meshio>=5.3.5",
    "pyvista>=0.49",
    "vtk>=9.7",
]
workbench = ["femforge-workbench==0.1.0"]

[project.urls]
Homepage = "https://femforge.io"
Documentation = "https://docs.femforge.io"
Repository = "https://github.com/femforge-io/femforge"
Issues = "https://github.com/femforge-io/femforge/issues"

[project.scripts]
femforge = "femforge.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/femforge"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "CHANGELOG.md", "CITATION.cff", "LICENSE", "NOTICE"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
femforge-workbench = { workspace = true }
femforge-docs = { path = "tools/docs", editable = true }

[tool.ruff]
src = ["src", "packages/femforge-workbench/src", "examples/*", "tools/docs/src"]
extend-exclude = ["tests"]
force-exclude = true
line-length = 200

[tool.ruff.lint]
ignore = ["F405", "F403", "F811"]
select = ["E", "F", "I"]
fixable = ["F401", "I001", "F541"]

[tool.ruff.lint.isort]
lines-between-types = 0
lines-after-imports = 2
combine-as-imports = true

[tool.basedpyright]
typeCheckingMode = "basic"
include = ["src", "tests", "packages/femforge-workbench/src", "packages/femforge-workbench/hatch_build.py", "scripts", "examples", "tools"]
exclude = [".venv", "**/__pycache__"]
extraPaths = ["src", "packages/femforge-workbench/src", "tools/docs/src"]
pythonVersion = "3.12"
stubPath = "typings"
reportUnnecessaryTypeIgnoreComment = "warning"

reportAny = "warning"
reportExplicitAny = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportMissingParameterType = "warning"
reportMissingTypeArgument = "warning"
reportUntypedFunctionDecorator = "warning"
reportNoOverloadImplementation = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/femforge-workbench/src/femforge_workbench/panels"
reportMissingModuleSource = "none"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "femforge-workbench[ocp]",
    "hatchling>=1.27",
    "pandas-stubs>=3.0.5.260730",
    "plotly-stubs>=0.1.4",
    "pytest>=9.1.0",
    "pytest-cov",
    "ruff",
    "types-pygments",
]
docs = [
    "femforge-docs",
    "griffe-pydantic>=1.3.2",
    "markdown-exec[ansi]>=1.12.4",
    "mkdocs-redirects>=1.2.2",
    "mkdocstrings-python>=2.0.9",
    "zensical>=0.0.69",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/femforge-workbench/src", "tools/docs/src"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "def print_tree",
    "if __name__ == .__main__.:",
    '@(abc\.)?abstractmethod',
]
omit = [
    "tests/*",
    "**/__init__.py",
    "src/femforge/templates/*",
]
